<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>COVIX — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020510;
    --surface: #080d18;
    --surface-2: #0f1625;
    --surface-3: #161e30;
    --primary: #7c3aed;
    --primary-light: #a78bfa;
    --primary-dark: #5b21b6;
    --primary-glow: rgba(124,58,237,0.4);
    --accent: #06b6d4;
    --text: #e2e8f0;
    --text-bright: #ffffff;
    --muted: #6b7280;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --border: rgba(255,255,255,0.06);
    --shadow-card: 0 8px 40px rgba(0,0,0,0.6);
    --radius-lg: 24px;
    --radius-pill: 50px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Dark grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
  }

  /* Animated shapes */
  .bg-shape {
    position: fixed; pointer-events: none; z-index: 0;
  }
  .shape-1 {
    width: 400px; height: 400px;
    border: 1px solid rgba(124,58,237,0.08);
    border-radius: 60px;
    top: -120px; right: -150px;
    transform: rotate(30deg);
    animation: rotateSlow 40s linear infinite;
  }
  .shape-2 {
    width: 300px; height: 300px;
    border: 1px solid rgba(6,182,212,0.06);
    border-radius: 40px;
    bottom: -80px; left: -100px;
    transform: rotate(-20deg);
    animation: rotateSlow 35s linear infinite reverse;
  }
  .shape-3 {
    width: 180px; height: 180px;
    background: rgba(124,58,237,0.05);
    border-radius: 50%;
    top: 40%; left: 8%;
    filter: blur(60px);
  }
  .shape-4 {
    width: 150px; height: 150px;
    background: rgba(6,182,212,0.04);
    border-radius: 50%;
    bottom: 25%; right: 5%;
    filter: blur(50px);
  }
  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .page-wrapper {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    padding: 20px;
    animation: fadeUp 0.6s cubic-bezier(0.22,0.61,0.36,1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Admin Badge */
  .admin-badge {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 28px;
  }
  .admin-icon {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #dc2626, var(--primary));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(220,38,38,0.3);
    position: relative;
  }
  .admin-icon::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 18px;
    background: linear-gradient(135deg, #dc2626, var(--primary));
    z-index: -1;
    opacity: 0.4;
    filter: blur(10px);
  }
  .admin-icon svg {
    width: 24px; height: 24px;
    color: #fff;
  }
  .brand-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700;
    color: var(--text-bright);
    letter-spacing: -0.5px;
  }
  .brand-text .admin-tag {
    display: block;
    font-size: 10px; font-weight: 600;
    color: #dc2626;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: -2px;
  }

  /* Login Card */
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 24px 24px;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(10px);
  }
  .login-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--text-bright);
    text-align: center; margin-bottom: 4px;
  }
  .login-card .subtitle {
    text-align: center; font-size: 12.5px;
    color: var(--muted); margin-bottom: 24px;
  }

  form { display: flex; flex-direction: column; gap: 16px; }

  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label {
    font-size: 10px; font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.8px; text-transform: uppercase;
    margin-left: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 14px 20px;
    color: var(--text-bright);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: all 0.25s ease;
  }
  .input-wrap input::placeholder { color: #4b5563; }
  .input-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(124,58,237,0.15);
  }
  .input-wrap input.input-error {
    border-color: var(--error);
    box-shadow: 0 0 0 4px rgba(239,68,68,0.1);
  }

  .input-wrap .eye-btn {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    padding: 8px; color: var(--muted);
    border-radius: 50%; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .input-wrap .eye-btn:hover { color: #fff; background: var(--surface-3); }

  .field-hint {
    font-size: 10.5px; min-height: 14px;
    margin-left: 14px; font-weight: 500;
  }
  .field-hint.invalid { color: var(--error); }

  .submit-btn {
    width: 100%; padding: 15px;
    border: none; border-radius: var(--radius-pill);
    background: linear-gradient(135deg, #dc2626, var(--primary));
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 30px rgba(220,38,38,0.25);
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(220,38,38,0.35);
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .submit-btn.loading .spinner { display: inline-block; }
  .submit-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-link {
    text-align: center; margin-top: 18px;
    font-size: 12.5px; color: var(--muted);
  }
  .back-link a {
    color: var(--primary-light); text-decoration: none; font-weight: 600;
  }
  .back-link a:hover { text-decoration: underline; }

  /* Toast */
  .toast-zone {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    width: calc(100% - 32px); max-width: 380px;
  }
  .toast-item {
    background: var(--surface-3); border: 1px solid var(--border);
    padding: 13px 15px; border-radius: 14px;
    font-size: 12.5px; box-shadow: var(--shadow-card);
    animation: toastSlide 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
    display: flex; align-items: center; gap: 8px; font-weight: 500;
  }
  .toast-item.error { border-left: 4px solid var(--error); }
  .toast-item.success { border-left: 4px solid var(--success); }
  .toast-emoji { font-size: 16px; flex: none; }
  @keyframes toastSlide {
    from { opacity: 0; transform: translateX(80px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 420px) {
    .page-wrapper { padding: 12px; }
    .login-card { padding: 24px 16px 20px; }
    .admin-icon { width: 42px; height: 42px; }
    .brand-text { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>
<div class="bg-shape shape-3"></div>
<div class="bg-shape shape-4"></div>
<div class="toast-zone" id="toastZone"></div>

<div class="page-wrapper">
  <!-- Admin Badge -->
  <div class="admin-badge">
    <div class="admin-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div>
      <span class="brand-text">COVIX</span>
      <span class="admin-tag">Admin Panel</span>
    </div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <h2>Admin Login</h2>
    <p class="subtitle">Secure access for authorized personnel</p>

    <form id="adminLoginForm" novalidate>
      <!-- Email -->
      <div class="field-group">
        <label for="email">Admin Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="admin@covix.com" autocomplete="email" required>
        </div>
        <div class="field-hint" id="emailHint"></div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" required>
          <button type="button" class="eye-btn" data-target="password" aria-label="Toggle password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-hint" id="passwordHint"></div>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Access Admin Panel</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <p class="back-link">
    <a href="login.html">← Back to User Login</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjANH3YIecQIuVh4KOrHSA2JSVE0MVFdw",
    authDomain: "covix-1f7d2.firebaseapp.com",
    projectId: "covix-1f7d2",
    storageBucket: "covix-1f7d2.firebasestorage.app",
    messagingSenderId: "550748233984",
    appId: "1:550748233984:web:ff2a36a3f601731a4ad3e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function toast(msg, type = "info") {
    const zone = document.getElementById("toastZone");
    const item = document.createElement("div");
    item.className = `toast-item ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    item.innerHTML = `<span class="toast-emoji">${icons[type]||icons.info}</span>${msg}`;
    if (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    zone.appendChild(item);
    setTimeout(() => {
      item.style.opacity = "0"; item.style.transform = "translateX(80px)";
      item.style.transition = "all 0.3s";
      setTimeout(() => { if (item.parentNode) item.remove(); }, 300);
    }, 4000);
  }

  // ── Password Toggle ───────────────────────────────
  document.querySelectorAll(".eye-btn[data-target]").forEach(btn => {
    btn.addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      const input = document.getElementById(this.dataset.target);
      if (!input) return;
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      this.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });
  });

  // ── Check if already logged in as admin ───────────
  onAuthStateChanged(auth, async user => {
    if (user) {
      // Check if user is admin
      const adminSnap = await getDoc(doc(db, "admins", user.uid));
      if (adminSnap.exists()) {
        // Already logged in as admin, redirect to dashboard
        window.location.href = "admin-dashboard.html";
      }
    }
  });

  // ── Form Submit ───────────────────────────────────
  const els = {
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    submitBtn: document.getElementById("submitBtn"),
    form: document.getElementById("adminLoginForm")
  };

  function setHint(id, msg, state) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.className = "field-hint" + (state ? " " + state : ""); }
  }
  function markInput(el, state) {
    if (el) { el.classList.remove("input-error"); if (state) el.classList.add(state); }
  }

  els.form.addEventListener("submit", async e => {
    e.preventDefault();

    const email = els.email.value.trim();
    const password = els.password.value;

    if (!email) {
      setHint("emailHint", "Email is required", "invalid");
      markInput(els.email, "input-error");
      return;
    }
    if (!password) {
      setHint("passwordHint", "Password is required", "invalid");
      markInput(els.password, "input-error");
      return;
    }

    setHint("emailHint", "");
    setHint("passwordHint", "");
    markInput(els.email, "");
    markInput(els.password, "");

    els.submitBtn.disabled = true;
    els.submitBtn.classList.add("loading");

    try {
      // Sign in with Firebase Auth
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;

      // Check if this user is an admin
      const adminSnap = await getDoc(doc(db, "admins", uid));

      if (!adminSnap.exists()) {
        // Not an admin
        await auth.signOut();
        toast("Access denied. You are not authorized as an admin.", "error");
        els.submitBtn.disabled = false;
        els.submitBtn.classList.remove("loading");
        return;
      }

      const adminData = adminSnap.data();

      // Check if admin is active
      if (adminData.status === "suspended") {
        await auth.signOut();
        toast("Your admin account has been suspended.", "error");
        els.submitBtn.disabled = false;
        els.submitBtn.classList.remove("loading");
        return;
      }

      // Store admin session
      sessionStorage.setItem("covix_admin_cache", JSON.stringify({
        uid,
        name: adminData.name || "Admin",
        email: adminData.email || email,
        role: adminData.role || "admin",
        loginTime: Date.now()
      }));

      // Update last login
      const { updateDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      await updateDoc(doc(db, "admins", uid), {
        lastLogin: serverTimestamp()
      });

      toast("Welcome back, Admin!", "success", 2000);
      setTimeout(() => {
        window.location.href = "admin-dashboard.html";
      }, 1000);

    } catch (err) {
      console.error("Admin login error:", err);
      let msg = "Login failed. Try again.";
      if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
        msg = "Invalid email or password.";
        markInput(els.email, "input-error");
        markInput(els.password, "input-error");
      } else if (err.code === "auth/wrong-password") {
        msg = "Incorrect password.";
        markInput(els.password, "input-error");
      } else if (err.code === "auth/too-many-requests") {
        msg = "Too many attempts. Try again later.";
      } else if (err.code === "auth/invalid-email") {
        msg = "Invalid email format.";
        markInput(els.email, "input-error");
      }
      toast(msg, "error");
      els.submitBtn.disabled = false;
      els.submitBtn.classList.remove("loading");
    }
  });

  console.log("🔐 Covix Admin Login — Ready");
</script>
</body>
</html>
