<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>COVIX — Transaction Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020510; --surface: #080d18; --surface-2: #0f1625; --surface-3: #161e30;
    --primary: #7c3aed; --primary-light: #a78bfa; --primary-dark: #5b21b6;
    --primary-glow: rgba(124,58,237,0.4); --accent: #06b6d4;
    --text: #e2e8f0; --text-bright: #ffffff; --muted: #6b7280;
    --success: #10b981; --warning: #f59e0b; --error: #ef4444;
    --gold: #f59e0b; --border: rgba(255,255,255,0.06);
    --shadow-card: 0 4px 32px rgba(0,0,0,0.5);
    --radius-lg: 22px; --radius-md: 14px; --radius-pill: 50px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; min-height: 100vh;
    overflow-x: hidden; position: relative;
  }
  .bg-glow {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(80px); opacity: 0.15;
  }
  .glow-1 { width: 280px; height: 280px; background: rgba(124,58,237,0.1); top: -60px; right: -50px; }
  .glow-2 { width: 220px; height: 220px; background: rgba(6,182,212,0.08); bottom: -50px; left: -40px; }

  .page-container {
    position: relative; z-index: 1; max-width: 1100px; margin: 0 auto;
    padding: 20px 14px 100px; animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .back-btn {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 9px 16px;
    color: var(--muted); font-size: 12px; cursor: pointer;
    text-decoration: none; transition: all 0.25s;
  }
  .back-btn:hover { border-color: var(--primary); color: #fff; }
  .page-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-bright); }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px; text-align: center;
  }
  .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--text-bright); }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-top: 2px; }

  /* Filters Row */
  .filters-row {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 10px 16px;
    color: var(--text-bright); font-size: 12px; font-family: 'DM Sans', sans-serif;
    outline: none; cursor: pointer; min-width: 120px;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center;
    padding-right: 36px;
  }
  .filter-select option { background: var(--surface-2); color: var(--text); }
  .search-input {
    flex: 1; min-width: 180px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius-pill); padding: 10px 18px;
    color: var(--text-bright); font-size: 12px; font-family: 'DM Sans', sans-serif;
    outline: none; transition: all 0.25s;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-input::placeholder { color: #4b5563; }
  .refresh-btn {
    padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); color: var(--muted); cursor: pointer;
    transition: all 0.25s; font-size: 14px;
  }
  .refresh-btn:hover { border-color: var(--primary); color: #fff; }

  /* Table */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden; overflow-x: auto;
  }
  .tx-table {
    width: 100%; border-collapse: collapse; font-size: 11px; min-width: 700px;
  }
  .tx-table th {
    text-align: left; padding: 12px 14px;
    background: var(--surface-2); color: var(--muted);
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; font-family: 'Space Grotesk', sans-serif;
    white-space: nowrap;
  }
  .tx-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tx-table tr:hover td { background: var(--surface-2); }

  .user-cell { display: flex; align-items: center; gap: 8px; }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; flex: none;
  }
  .user-name { font-weight: 600; color: var(--text-bright); }
  .user-email { font-size: 9px; color: var(--muted); }

  .type-badge {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
    font-size: 9px; font-weight: 700; text-transform: uppercase;
  }
  .type-badge.deposit { background: rgba(16,185,129,0.15); color: var(--success); }
  .type-badge.withdrawal { background: rgba(239,68,68,0.12); color: var(--error); }
  .type-badge.invest { background: rgba(6,182,212,0.15); color: var(--accent); }
  .type-badge.earning { background: rgba(16,185,129,0.12); color: var(--success); }
  .type-badge.bonus { background: rgba(124,58,237,0.15); color: var(--primary-light); }
  .type-badge.referral_bonus { background: rgba(245,158,11,0.15); color: var(--gold); }

  .amount-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; }
  .amount-text.credit { color: var(--success); }
  .amount-text.debit { color: var(--error); }

  .status-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px;
  }
  .status-dot.completed { background: var(--success); }
  .status-dot.pending { background: var(--warning); }
  .status-dot.declined, .status-dot.rejected { background: var(--error); }

  .empty-state { text-align: center; padding: 50px 20px; }
  .empty-state svg { width: 40px; height: 40px; color: var(--muted); margin-bottom: 8px; }
  .empty-state p { color: var(--muted); font-size: 13px; }

  /* Pagination */
  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-top: 16px;
  }
  .page-btn {
    padding: 8px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); color: var(--muted); cursor: pointer;
    font-size: 11px; font-weight: 600; transition: all 0.2s;
    font-family: 'Space Grotesk', sans-serif;
  }
  .page-btn:hover { border-color: var(--primary); color: #fff; }
  .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 11px; color: var(--muted); padding: 0 8px; }

  .toast-zone { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 380px; }
  .toast-item { background: var(--surface-3); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius-md); font-size: 12px; box-shadow: var(--shadow-card); animation: toastSlide 0.4s ease; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .toast-item.error { border-left: 4px solid var(--error); }
  .toast-item.success { border-left: 4px solid var(--success); }
  .toast-emoji { font-size: 15px; flex: none; }
  @keyframes toastSlide { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom,8px);
    z-index: 100; box-shadow: 0 -5px 25px rgba(0,0,0,0.4);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted); text-decoration: none; font-size: 9px; font-weight: 600;
    padding: 5px 12px; border-radius: 50px; transition: all 0.25s;
  }
  .nav-item.active { color: #dc2626; }
  .nav-item svg { width: 18px; height: 18px; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .filters-row { flex-direction: column; }
    .filter-select, .search-input { width: 100%; }
  }
</style>
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>
<div class="toast-zone" id="toastZone"></div>

<div class="page-container">
  <div class="top-bar">
    <a href="admin-dashboard.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
      Back
    </a>
    <span class="page-title">Transaction Logs</span>
    <button class="refresh-btn" id="refreshBtn">🔄</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total Transactions</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--success);" id="statCredits">₦0</div>
      <div class="stat-label">Total Credits</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--error);" id="statDebits">₦0</div>
      <div class="stat-label">Total Debits</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statUsers">0</div>
      <div class="stat-label">Unique Users</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-row">
    <select class="filter-select" id="filterType">
      <option value="all">All Types</option>
      <option value="deposit">Deposits</option>
      <option value="withdrawal">Withdrawals</option>
      <option value="invest">Investments</option>
      <option value="earning">Earnings (ROI)</option>
      <option value="bonus">Bonuses</option>
      <option value="referral_bonus">Referral Bonuses</option>
    </select>
    <select class="filter-select" id="filterStatus">
      <option value="all">All Statuses</option>
      <option value="completed">Completed</option>
      <option value="pending">Pending</option>
      <option value="declined">Declined</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
    <input type="text" class="search-input" id="searchInput" placeholder="Search by username, description, or amount...">
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table class="tx-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Type</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date & Time</th>
        </tr>
      </thead>
      <tbody id="txTableBody">
        <tr><td colspan="6"><div class="empty-state"><p>Loading transactions...</p></div></td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<nav class="bottom-nav">
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14"/></svg>Withdrawals</a>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjANH3YIecQIuVh4KOrHSA2JSVE0MVFdw",
    authDomain: "covix-1f7d2.firebaseapp.com",
    projectId: "covix-1f7d2",
    storageBucket: "covix-1f7d2.firebasestorage.app",
    messagingSenderId: "550748233984",
    appId: "1:550748233984:web:ff2a36a3f601731a4ad3e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ITEMS_PER_PAGE = 15;
  let allTransactions = [];
  let userCache = {};
  let currentPage = 1;

  function toast(msg, type = "info") {
    const zone = document.getElementById("toastZone");
    const item = document.createElement("div");
    item.className = `toast-item ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    item.innerHTML = `<span class="toast-emoji">${icons[type]||icons.info}</span>${msg}`;
    if (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    zone.appendChild(item);
    setTimeout(() => { item.style.opacity="0"; item.style.transform="translateX(80px)"; item.style.transition="all 0.3s"; setTimeout(() => item.remove(), 300); }, 4000);
  }

  function fmtN(n) { return "₦" + Number(n||0).toLocaleString("en-NG"); }
  function fmtDateTime(ts) {
    if (!ts) return "N/A";
    return new Date(ts.seconds*1000).toLocaleDateString("en-NG", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function isCreditType(type) {
    return ["deposit", "bonus", "earning", "referral_bonus"].includes(type);
  }

  // ── Load All Transactions ─────────────────────────
  async function loadTransactions() {
    const tbody = document.getElementById("txTableBody");
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p>Loading transactions...</p></div></td></tr>`;

    try {
      allTransactions = [];
      userCache = {};

      // Get all users
      const usersSnap = await getDocs(collection(db, "users"));
      usersSnap.forEach(doc => {
        userCache[doc.id] = doc.data();
      });

      // Fetch transactions for each user
      for (const [uid, userData] of Object.entries(userCache)) {
        try {
          const txSnap = await getDocs(collection(db, "users", uid, "transactions"));
          txSnap.forEach(doc => {
            const tx = doc.data();
            // Skip the "recent" cache document
            if (doc.id === "recent") return;
            allTransactions.push({
              id: doc.id,
              uid,
              userName: userData.name || "Unknown",
              userUsername: userData.username || "unknown",
              userEmail: userData.email || "N/A",
              ...tx
            });
          });
        } catch (err) {
          console.error(`Error loading transactions for ${uid}:`, err);
        }
      }

      // Sort by timestamp (newest first)
      allTransactions.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

      console.log(`📋 Loaded ${allTransactions.length} transactions from ${Object.keys(userCache).length} users`);

      updateStats();
      currentPage = 1;
      renderTable();

    } catch (err) {
      console.error("Load error:", err);
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p style="color:var(--error);">Failed to load transactions.</p></div></td></tr>`;
    }
  }

  // ── Stats ─────────────────────────────────────────
  function updateStats() {
    const totalCredits = allTransactions
      .filter(tx => isCreditType(tx.type))
      .reduce((sum, tx) => sum + (tx.amount || 0), 0);
    const totalDebits = allTransactions
      .filter(tx => !isCreditType(tx.type))
      .reduce((sum, tx) => sum + (tx.amount || 0), 0);
    const uniqueUsers = new Set(allTransactions.map(tx => tx.uid)).size;

    document.getElementById("statTotal").textContent = allTransactions.length;
    document.getElementById("statCredits").textContent = fmtN(totalCredits);
    document.getElementById("statDebits").textContent = fmtN(totalDebits);
    document.getElementById("statUsers").textContent = uniqueUsers;
  }

  // ── Get Filtered Transactions ────────────────────
  function getFilteredTransactions() {
    const typeFilter = document.getElementById("filterType").value;
    const statusFilter = document.getElementById("filterStatus").value;
    const searchQuery = document.getElementById("searchInput").value.toLowerCase();

    let filtered = [...allTransactions];

    if (typeFilter !== "all") {
      filtered = filtered.filter(tx => tx.type === typeFilter);
    }
    if (statusFilter !== "all") {
      filtered = filtered.filter(tx => (tx.status || "completed") === statusFilter);
    }
    if (searchQuery) {
      filtered = filtered.filter(tx =>
        (tx.userName || "").toLowerCase().includes(searchQuery) ||
        (tx.userUsername || "").toLowerCase().includes(searchQuery) ||
        (tx.description || "").toLowerCase().includes(searchQuery) ||
        String(tx.amount || "").includes(searchQuery)
      );
    }

    return filtered;
  }

  // ── Render Table ──────────────────────────────────
  function renderTable() {
    const filtered = getFilteredTransactions();
    const tbody = document.getElementById("txTableBody");
    const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);

    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

    if (!pageItems.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="6" y1="8" x2="18" y2="8"/></svg><p>No transactions found.</p></div></td></tr>`;
      document.getElementById("pagination").innerHTML = "";
      return;
    }

    tbody.innerHTML = pageItems.map(tx => {
      const credit = isCreditType(tx.type);
      const status = tx.status || "completed";
      const statusClass = status === "completed" || status === "approved" ? "completed" :
                          status === "pending" ? "pending" : "declined";

      return `<tr>
        <td>
          <div class="user-cell">
            <div class="user-avatar">${(tx.userName||"U").charAt(0).toUpperCase()}</div>
            <div>
              <div class="user-name">${tx.userName||"Unknown"}</div>
              <div class="user-email">@${tx.userUsername||"user"}</div>
            </div>
          </div>
        </td>
        <td><span class="type-badge ${tx.type}">${(tx.type||"N/A").replace(/_/g, " ")}</span></td>
        <td style="max-width:200px;white-space:normal;">${tx.description||"N/A"}</td>
        <td><span class="amount-text ${credit ? 'credit' : 'debit'}">${credit ? '+' : '-'}${fmtN(tx.amount)}</span></td>
        <td><span class="status-dot ${statusClass}"></span>${status}</td>
        <td>${fmtDateTime(tx.timestamp)}</td>
      </tr>`;
    }).join("");

    // Pagination
    renderPagination(totalPages);
  }

  // ── Pagination ────────────────────────────────────
  function renderPagination(totalPages) {
    const pag = document.getElementById("pagination");
    if (totalPages <= 1) { pag.innerHTML = ""; return; }

    let html = `<button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>`;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        html += `<span class="page-info">...</span>`;
      }
    }

    html += `<button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
    html += `<span class="page-info">${currentPage} of ${totalPages}</span>`;

    pag.innerHTML = html;

    pag.querySelectorAll(".page-btn:not([disabled])").forEach(btn => {
      btn.addEventListener("click", () => {
        currentPage = parseInt(btn.dataset.page);
        renderTable();
        // Scroll to top of table
        document.querySelector(".table-wrap").scrollIntoView({ behavior: "smooth" });
      });
    });
  }

  // ── Filter Listeners ──────────────────────────────
  document.getElementById("filterType").addEventListener("change", () => {
    currentPage = 1;
    renderTable();
  });
  document.getElementById("filterStatus").addEventListener("change", () => {
    currentPage = 1;
    renderTable();
  });
  document.getElementById("searchInput").addEventListener("input", () => {
    currentPage = 1;
    renderTable();
  });

  document.getElementById("refreshBtn").addEventListener("click", loadTransactions);

  // ── Auth ──────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "admin-login.html"; return; }
    const adminSnap = await getDoc(doc(db, "admins", user.uid));
    if (!adminSnap.exists()) { await signOut(auth); window.location.href = "admin-login.html"; return; }
    loadTransactions();
  });

  console.log("📋 Covix Admin Transactions — Ready");
</script>
