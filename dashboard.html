<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>COVIX — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712; --surface: #0a0f1a; --surface-2: #111827; --surface-3: #1a2332;
    --primary: #7c3aed; --primary-light: #a78bfa; --primary-dark: #5b21b6;
    --primary-glow: rgba(124,58,237,0.35); --accent: #06b6d4;
    --accent-glow: rgba(6,182,212,0.3); --text: #e2e8f0; --text-bright: #ffffff;
    --muted: #6b7280; --success: #10b981; --warning: #f59e0b; --error: #ef4444;
    --gold: #f59e0b; --border: rgba(255,255,255,0.06);
    --shadow-card: 0 4px 32px rgba(0,0,0,0.5);
    --radius-lg: 24px; --radius-md: 14px; --radius-pill: 50px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; min-height: 100vh;
    overflow-x: hidden; position: relative;
  }
  .bg-glow {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(80px); opacity: 0.2;
  }
  .glow-1 { width: 280px; height: 280px; background: rgba(124,58,237,0.12); top: -80px; right: -60px; }
  .glow-2 { width: 250px; height: 250px; background: rgba(6,182,212,0.08); bottom: -80px; left: -70px; }

  .dashboard-container {
    position: relative; z-index: 1; max-width: 900px; margin: 0 auto;
    padding: 20px 14px 100px; animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
  .user-greeting { display: flex; align-items: center; gap: 10px; }
  .avatar-circle {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 800;
    color: #fff; flex: none; box-shadow: 0 4px 16px rgba(124,58,237,0.35);
  }
  .greeting-text h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--text-bright); }
  .greeting-text p { font-size: 11.5px; color: var(--muted); }
  .logout-btn {
    padding: 9px 16px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-pill); color: var(--muted); font-size: 12px;
    cursor: pointer; transition: all 0.25s; display: flex; align-items: center; gap: 5px;
  }
  .logout-btn:hover { border-color: var(--error); color: var(--error); }

  .wallet-section { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
  .wallet-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px;
    box-shadow: var(--shadow-card);
  }
  .wallet-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-family: 'Space Grotesk', sans-serif; }
  .wallet-amount { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 800; color: var(--text-bright); }
  .wallet-card.primary { border-left: 3px solid var(--primary); }
  .wallet-card.accent { border-left: 3px solid var(--accent); }
  .wallet-card.success { border-left: 3px solid var(--success); }

  .quick-actions { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  .action-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px 10px; text-align: center;
    cursor: pointer; transition: all 0.25s; text-decoration: none; color: var(--text);
  }
  .action-card:hover { background: var(--surface-2); border-color: var(--primary); transform: translateY(-2px); }
  .action-icon { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .action-icon svg { width: 18px; height: 18px; }
  .action-icon.deposit { color: var(--primary-light); background: rgba(124,58,237,0.15); }
  .action-icon.withdraw { color: var(--accent); background: rgba(6,182,212,0.15); }
  .action-icon.invest { color: var(--success); background: rgba(16,185,129,0.15); }
  .action-icon.share { color: #f59e0b; background: rgba(245,158,11,0.15); }
  .action-label { font-size: 11px; font-weight: 600; color: var(--text); }

  /* Tabs */
  .dashboard-tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 4px;
  }
  .dash-tab {
    flex: 1; text-align: center; padding: 10px 8px;
    border-radius: var(--radius-pill); cursor: pointer;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    transition: all 0.25s; font-family: 'Space Grotesk', sans-serif;
  }
  .dash-tab.active {
    background: var(--primary); color: #fff;
    box-shadow: 0 4px 14px var(--primary-glow);
  }
  .tab-badge {
    display: inline-block; background: rgba(255,255,255,0.2);
    border-radius: 50px; padding: 1px 8px; font-size: 10px; margin-left: 4px;
  }

  /* Section Header */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-header h4 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-bright); }
  .section-header a { font-size: 11.5px; color: var(--primary-light); text-decoration: none; font-weight: 600; }

  /* Investments List */
  .investments-list { display: flex; flex-direction: column; gap: 8px; }
  .investment-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px;
    transition: all 0.25s;
  }
  .investment-card:hover { border-color: var(--primary); }
  .inv-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .inv-plan-name {
    font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--text-bright); display: flex; align-items: center; gap: 8px;
  }
  .inv-plan-name .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .inv-countdown {
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--warning); background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: var(--radius-pill); padding: 4px 12px;
  }
  .inv-countdown.ready { color: var(--success); background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.25); }
  .inv-details-row {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
  }
  .inv-detail-item {
    background: var(--surface-2); border-radius: 8px; padding: 8px; text-align: center;
  }
  .inv-detail-value {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--text-bright); margin-bottom: 1px;
  }
  .inv-detail-value.green { color: var(--success); }
  .inv-detail-value.accent { color: var(--accent); }
  .inv-detail-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }

  /* Progress Bar */
  .inv-progress-bar {
    width: 100%; height: 4px; background: var(--surface-2);
    border-radius: 2px; margin-top: 10px; overflow: hidden;
  }
  .inv-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 2px; transition: width 0.5s ease;
  }

  /* Transactions */
  .tx-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .tx-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .tx-row:last-child { border-bottom: none; }
  .tx-info { display: flex; align-items: center; gap: 10px; }
  .tx-icon-wrap { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .tx-icon-wrap.deposit { background: rgba(16,185,129,0.15); color: var(--success); }
  .tx-icon-wrap.withdraw { background: rgba(239,68,68,0.12); color: var(--error); }
  .tx-icon-wrap.bonus { background: rgba(124,58,237,0.15); color: var(--primary-light); }
  .tx-icon-wrap.invest { background: rgba(6,182,212,0.15); color: var(--accent); }
  .tx-icon-wrap.earning { background: rgba(16,185,129,0.15); color: var(--success); }
  .tx-icon-wrap svg { width: 15px; height: 15px; }
  .tx-name { font-size: 12px; font-weight: 600; color: var(--text-bright); }
  .tx-date { font-size: 10px; color: var(--muted); }
  .tx-amount { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; }
  .tx-amount.positive { color: var(--success); }
  .tx-amount.negative { color: var(--error); }

  .empty-state { text-align: center; padding: 30px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .empty-state svg { width: 40px; height: 40px; color: var(--muted); margin-bottom: 8px; }
  .empty-state p { color: var(--muted); font-size: 12px; }
  .empty-state a { color: var(--primary-light); font-weight: 600; text-decoration: none; font-size: 12px; }

  .toast-zone { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 380px; }
  .toast-item { background: var(--surface-3); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius-md); font-size: 12px; box-shadow: var(--shadow-card); animation: toastSlide 0.4s ease; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .toast-item.error { border-left: 4px solid var(--error); }
  .toast-item.success { border-left: 4px solid var(--success); }
  .toast-emoji { font-size: 15px; flex: none; }
  @keyframes toastSlide { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 env(safe-area-inset-bottom,8px); z-index: 100; box-shadow: 0 -5px 25px rgba(0,0,0,0.4); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 9px; font-weight: 600; padding: 5px 14px; border-radius: 50px; transition: all 0.25s; }
  .nav-item.active { color: var(--primary-light); }
  .nav-item svg { width: 18px; height: 18px; }

  @media (max-width: 600px) {
    .wallet-section, .quick-actions { grid-template-columns: repeat(2,1fr); }
    .inv-details-row { grid-template-columns: repeat(2,1fr); }
    .wallet-amount { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>
<div class="toast-zone" id="toastZone"></div>

<div class="dashboard-container">
  <div class="top-bar">
    <div class="user-greeting">
      <div class="avatar-circle" id="avatarInitial">C</div>
      <div class="greeting-text">
        <h3 id="greetingName">Welcome</h3>
        <p id="greetingUsername">@user</p>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Logout
    </button>
  </div>

  <div class="wallet-section">
    <div class="wallet-card primary"><div class="wallet-label">Deposit Wallet</div><div class="wallet-amount" id="depositWallet">₦0</div></div>
    <div class="wallet-card accent"><div class="wallet-label">Withdrawal Wallet</div><div class="wallet-amount" id="withdrawWallet">₦0</div></div>
    <div class="wallet-card success"><div class="wallet-label">Total Balance</div><div class="wallet-amount" id="totalBalance">₦0</div></div>
  </div>

  <div class="quick-actions">
    <a href="deposit.html" class="action-card"><div class="action-icon deposit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div><div class="action-label">Deposit</div></a>
    <a href="withdraw.html" class="action-card"><div class="action-icon withdraw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14"/></svg></div><div class="action-label">Withdraw</div></a>
    <a href="invest.html" class="action-card"><div class="action-icon invest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg></div><div class="action-label">Invest</div></a>
    <a href="referral.html" class="action-card"><div class="action-icon share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div><div class="action-label">Referral</div></a>
  </div>

  <!-- Tabs -->
  <div class="dashboard-tabs">
    <div class="dash-tab active" data-tab="investments">
      My Investments <span class="tab-badge" id="invCount">0</span>
    </div>
    <div class="dash-tab" data-tab="transactions">
      Transactions <span class="tab-badge" id="txCount">0</span>
    </div>
  </div>

  <!-- Investments Panel -->
  <div id="panelInvestments">
    <div class="section-header">
      <h4>Active Plans</h4>
      <a href="invest.html">+ New Investment</a>
    </div>
    <div class="investments-list" id="investmentsList">
      <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg><p>Loading...</p></div>
    </div>
  </div>

  <!-- Transactions Panel -->
  <div id="panelTransactions" style="display:none;">
    <div class="section-header">
      <h4>Recent Activity</h4>
      <a href="transactions.html">View All</a>
    </div>
    <div class="tx-list" id="txList">
      <div class="tx-row" style="justify-content:center;padding:20px;"><span style="color:var(--muted);font-size:12px;">Loading...</span></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>Home</a>
  <a href="invest.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>Invest</a>
  <a href="referral.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17,11 19,13 23,9"/></svg>Referral</a>
  <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjANH3YIecQIuVh4KOrHSA2JSVE0MVFdw",
    authDomain: "covix-1f7d2.firebaseapp.com",
    projectId: "covix-1f7d2",
    storageBucket: "covix-1f7d2.firebasestorage.app",
    messagingSenderId: "550748233984",
    appId: "1:550748233984:web:ff2a36a3f601731a4ad3e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ROI_MS = 24 * 60 * 60 * 1000;
  let currentUid = null;
  let timers = [];
  let processingROI = {};
  let cachedData = { investments: [], transactions: [] };

  function toast(msg, type = "info") {
    const zone = document.getElementById("toastZone");
    const item = document.createElement("div");
    item.className = `toast-item ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    item.innerHTML = `<span class="toast-emoji">${icons[type]||icons.info}</span>${msg}`;
    if (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    zone.appendChild(item);
    setTimeout(() => { item.style.opacity="0"; item.style.transform="translateX(80px)"; item.style.transition="all 0.3s"; setTimeout(() => item.remove(), 300); }, 4000);
  }

  function fmtN(n) { return "₦" + Number(n||0).toLocaleString("en-NG"); }
  function fmtCD(ms) {
    if (ms <= 0) return "Ready!";
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
    return `${h}h ${m}m ${s}s`;
  }

  // ── Fetch ALL data from Firestore ─────────────────
  async function fetchAllData(uid) {
    console.log("📡 Fetching from Firestore...");
    const snap = await getDoc(doc(db, "users", uid));
    if (!snap.exists()) return null;
    const d = snap.data();

    const data = {
      name: d.name || "User", username: d.username || "user",
      depositWallet: d.depositWallet || 0, withdrawalWallet: d.withdrawalWallet || 0,
      totalDeposit: d.totalDeposit || 0, totalEarnings: d.totalEarnings || 0,
      totalInvested: d.totalInvested || 0, totalWithdrawn: d.totalWithdrawn || 0,
      activePlansCount: d.activePlansCount || 0,
      investments: [], transactions: []
    };

    // Fetch investments from active_list
    const listSnap = await getDoc(doc(db, "users", uid, "investments", "active_list"));
    const ids = listSnap.exists() ? (listSnap.data().activeIds || []) : [];
    console.log("📋 Active IDs:", ids);

    for (const id of ids) {
      const invSnap = await getDoc(doc(db, "users", uid, "investments", id));
      if (invSnap.exists() && invSnap.data().active) {
        data.investments.push({ id, ...invSnap.data() });
      }
    }
    console.log("✅ Investments loaded:", data.investments.length);

    // Fetch transactions
    const txSnap = await getDoc(doc(db, "users", uid, "transactions", "recent"));
    data.transactions = txSnap.exists() ? (txSnap.data().items || []) : [];
    console.log("✅ Transactions loaded:", data.transactions.length);

    return data;
  }

  // ── Credit ROI (protected from double-credit) ─────
  async function creditROI(inv) {
    if (!currentUid || processingROI[inv.id]) return;
    processingROI[inv.id] = true;

    try {
      const daily = inv.dailyEarning || 0;
      const daysElapsed = (inv.daysElapsed || 0) + 1;
      const totalEarned = (inv.totalEarned || 0) + daily;
      const completed = daysElapsed >= (inv.duration || 40);
      const now = Date.now();

      console.log(`💰 ROI: ${inv.planName} Day ${daysElapsed} | +${fmtN(daily)}`);

      // Update investment
      const invUp = { daysElapsed, totalEarned, lastEarningDate: serverTimestamp() };
      if (completed) { invUp.active = false; invUp.completedAt = serverTimestamp(); }
      await updateDoc(doc(db, "users", currentUid, "investments", inv.id), invUp);

      // Update user
      const userUp = { withdrawalWallet: increment(daily), totalEarnings: increment(daily) };
      if (completed) {
        userUp.activePlansCount = increment(-1);
        const lsnap = await getDoc(doc(db, "users", currentUid, "investments", "active_list"));
        if (lsnap.exists()) {
          const newIds = (lsnap.data().activeIds || []).filter(id => id !== inv.id);
          await setDoc(doc(db, "users", currentUid, "investments", "active_list"), { activeIds: newIds });
        }
      }
      await updateDoc(doc(db, "users", currentUid), userUp);

      // Log transaction
      const txId = "earning_" + now + "_" + Math.random().toString(36).slice(2,6);
      await setDoc(doc(db, "users", currentUid, "transactions", txId), {
        type: "earning", amount: daily,
        description: `${inv.planName} Daily ROI (Day ${daysElapsed})`,
        timestamp: serverTimestamp()
      });

      // Update local cache
      cachedData.withdrawalWallet = (cachedData.withdrawalWallet||0) + daily;
      cachedData.totalEarnings = (cachedData.totalEarnings||0) + daily;
      if (completed) {
        cachedData.activePlansCount = Math.max(0, (cachedData.activePlansCount||1) - 1);
        cachedData.investments = cachedData.investments.filter(i => i.id !== inv.id);
      } else {
        const idx = cachedData.investments.findIndex(i => i.id === inv.id);
        if (idx >= 0) {
          cachedData.investments[idx].daysElapsed = daysElapsed;
          cachedData.investments[idx].totalEarned = totalEarned;
          cachedData.investments[idx].lastEarningDate = { seconds: Math.floor(now/1000) };
        }
      }
      cachedData.transactions.unshift({
        type: "earning", amount: daily,
        description: `${inv.planName} Daily ROI (Day ${daysElapsed})`,
        timestamp: { seconds: Math.floor(now/1000) }
      });
      if (cachedData.transactions.length > 20) cachedData.transactions = cachedData.transactions.slice(0,20);

      renderUI(cachedData);
      toast(`${fmtN(daily)} ROI credited!`, "success");
      if (completed) toast(`${inv.planName} completed! 🎉`, "success");

    } catch (err) { console.error("ROI error:", err); }
    finally { delete processingROI[inv.id]; }
  }

  // ── Render UI ─────────────────────────────────────
  function renderUI(d) {
    document.getElementById("avatarInitial").textContent = (d.name||"U").charAt(0).toUpperCase();
    document.getElementById("greetingName").textContent = "Hi, " + (d.name||"User").split(" ")[0];
    document.getElementById("greetingUsername").textContent = "@" + (d.username||"user");
    document.getElementById("depositWallet").textContent = fmtN(d.depositWallet);
    document.getElementById("withdrawWallet").textContent = fmtN(d.withdrawalWallet);
    document.getElementById("totalBalance").textContent = fmtN((d.depositWallet||0)+(d.withdrawalWallet||0));
    document.getElementById("invCount").textContent = (d.investments||[]).length;
    document.getElementById("txCount").textContent = (d.transactions||[]).length;
    renderInvestments(d.investments||[]);
    renderTransactions(d.transactions||[]);
  }

  function renderInvestments(investments) {
    const container = document.getElementById("investmentsList");
    timers.forEach(clearInterval);
    timers = [];

    if (!investments.length) {
      container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg><p>No active investments</p><a href="invest.html">Start Investing →</a></div>`;
      return;
    }

    container.innerHTML = investments.map(inv => {
      const days = inv.daysElapsed || 0;
      const total = inv.duration || 40;
      const pct = Math.round((days/total)*100);
      const lastMs = inv.lastEarningDate ? inv.lastEarningDate.seconds*1000 : (inv.createdAt?.seconds*1000 || Date.now());
      const nextMs = lastMs + ROI_MS;
      const rem = nextMs - Date.now();

      return `<div class="investment-card">
        <div class="inv-top">
          <span class="inv-plan-name"><span class="dot"></span>${inv.planName} Plan</span>
          <span class="inv-countdown ${rem<=0?'ready':''}" id="cd-${inv.id}">${rem<=0?'Ready!':fmtCD(rem)}</span>
        </div>
        <div class="inv-details-row">
          <div class="inv-detail-item">
            <div class="inv-detail-value green">${fmtN(inv.dailyEarning)}</div>
            <div class="inv-detail-label">Daily ROI</div>
          </div>
          <div class="inv-detail-item">
            <div class="inv-detail-value accent">${fmtN(inv.amount)}</div>
            <div class="inv-detail-label">Invested</div>
          </div>
          <div class="inv-detail-item">
            <div class="inv-detail-value">${fmtN(inv.totalEarned||0)}</div>
            <div class="inv-detail-label">Earned So Far</div>
          </div>
        </div>
        <div class="inv-progress-bar">
          <div class="inv-progress-fill" style="width:${pct}%;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted);">
          <span>Day ${days} / ${total}</span>
          <span>${pct}% Complete</span>
        </div>
      </div>`;
    }).join("");

    // Start timers
    for (const inv of investments) {
      const lastMs = inv.lastEarningDate ? inv.lastEarningDate.seconds*1000 : (inv.createdAt?.seconds*1000 || Date.now());
      const nextMs = lastMs + ROI_MS;

      if (Date.now() >= nextMs) { creditROI(inv); continue; }

      const timer = setInterval(() => {
        const rem = nextMs - Date.now();
        const el = document.getElementById("cd-" + inv.id);
        if (!el) { clearInterval(timer); return; }
        if (rem <= 0) {
          el.textContent = "Ready!";
          el.classList.add("ready");
          creditROI(inv);
          clearInterval(timer);
        } else {
          el.textContent = fmtCD(rem);
        }
      }, 1000);
      timers.push(timer);
    }
  }

  function renderTransactions(transactions) {
    const list = document.getElementById("txList");
    if (!transactions.length) {
      list.innerHTML = `<div class="tx-row" style="justify-content:center;padding:20px;"><span style="color:var(--muted);font-size:12px;">No transactions yet</span></div>`;
      return;
    }
    const icons = {
      deposit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
      withdrawal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14"/></svg>',
      bonus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      earning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>',
      invest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>',
      referral_bonus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>'
    };
    list.innerHTML = transactions.slice(0, 5).map(tx => {
      const credit = ["deposit","bonus","earning","referral_bonus"].includes(tx.type);
      const cls = tx.type === "deposit" ? "deposit" : tx.type === "withdrawal" ? "withdraw" : tx.type === "earning" ? "earning" : tx.type === "referral_bonus" ? "bonus" : "invest";
      const d = tx.timestamp?.seconds ? new Date(tx.timestamp.seconds*1000).toLocaleDateString("en-NG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "Recent";
      return `<div class="tx-row">
        <div class="tx-info"><div class="tx-icon-wrap ${cls}">${icons[cls]||icons.bonus}</div><div><div class="tx-name">${tx.description||tx.type}</div><div class="tx-date">${d}</div></div></div>
        <div class="tx-amount ${credit?'positive':'negative'}">${credit?'+':'-'}${fmtN(tx.amount)}</div>
      </div>`;
    }).join("");
  }

  // ── Tab Switching ─────────────────────────────────
  document.querySelector(".dashboard-tabs").addEventListener("click", e => {
    const tab = e.target.closest(".dash-tab");
    if (!tab) return;
    document.querySelectorAll(".dash-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const show = tab.dataset.tab;
    document.getElementById("panelInvestments").style.display = show === "investments" ? "block" : "none";
    document.getElementById("panelTransactions").style.display = show === "transactions" ? "block" : "none";
  });

  // ── Init ──────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUid = user.uid;

    const data = await fetchAllData(user.uid);
    if (data) {
      cachedData = data;
      renderUI(data);
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    timers.forEach(clearInterval);
    await signOut(auth);
    sessionStorage.clear();
    window.location.href = "login.html";
  });

  window.addEventListener("beforeunload", () => timers.forEach(clearInterval));
  console.log("⚡ Covix Dashboard Ready");
</script>
</body>
</html>
