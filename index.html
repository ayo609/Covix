<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>COVIX — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712;
    --surface: #0a0f1a;
    --surface-2: #111827;
    --surface-3: #1a2332;
    --primary: #7c3aed;
    --primary-light: #a78bfa;
    --primary-dark: #5b21b6;
    --primary-glow: rgba(124, 58, 237, 0.35);
    --accent: #06b6d4;
    --accent-glow: rgba(6, 182, 212, 0.3);
    --text: #e2e8f0;
    --text-bright: #ffffff;
    --muted: #6b7280;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --border: rgba(255, 255, 255, 0.06);
    --shadow-card: 0 4px 32px rgba(0, 0, 0, 0.5);
    --radius-pill: 50px;
    --radius-lg: 28px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-geo {
    position: fixed; pointer-events: none; z-index: 0;
  }
  .geo-1 {
    width: 500px; height: 500px;
    border: 1px solid rgba(124, 58, 237, 0.06);
    border-radius: 60px;
    top: -150px; right: -200px;
    transform: rotate(25deg);
    animation: geoRotate 30s linear infinite;
  }
  .geo-2 {
    width: 350px; height: 350px;
    border: 1px solid rgba(6, 182, 212, 0.05);
    border-radius: 40px;
    bottom: -100px; left: -120px;
    transform: rotate(-15deg);
    animation: geoRotate 25s linear infinite reverse;
  }
  .geo-3 {
    width: 200px; height: 200px;
    background: rgba(124, 58, 237, 0.04);
    border-radius: 50%;
    top: 30%; left: 10%;
    filter: blur(60px);
  }
  .geo-4 {
    width: 180px; height: 180px;
    background: rgba(6, 182, 212, 0.03);
    border-radius: 50%;
    bottom: 20%; right: 8%;
    filter: blur(60px);
  }
  @keyframes geoRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .page-wrapper {
    position: relative; z-index: 1;
    width: 100%; max-width: 500px;
    padding: 20px;
  }

  /* Logo */
  .logo-area {
    text-align: center; margin-bottom: 22px;
  }
  .logo-mark {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .logo-hex {
    width: 44px; height: 44px;
    background: var(--primary);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 25px var(--primary-glow);
  }
  .logo-hex svg { width: 20px; height: 20px; color: #fff; }
  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px; font-weight: 700;
    color: var(--text-bright); letter-spacing: -0.5px;
  }
  .logo-area .tagline {
    font-size: 12.5px; color: var(--muted); letter-spacing: 0.3px;
  }

  /* Bonus Strip */
  .bonus-strip {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(6, 182, 212, 0.12));
    border: 1px solid rgba(124, 58, 237, 0.25);
    border-radius: var(--radius-md); padding: 12px 18px;
    margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
  }
  .bonus-strip .gift-icon {
    width: 38px; height: 38px;
    background: rgba(124, 58, 237, 0.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .bonus-strip .bonus-info h4 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px; font-weight: 700;
    color: var(--primary-light); margin-bottom: 1px;
  }
  .bonus-strip .bonus-info span {
    font-size: 11px; color: var(--muted);
  }

  /* Main Card */
  .register-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 22px 22px;
    box-shadow: var(--shadow-card);
  }
  .register-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 2px; text-align: center;
  }
  .register-card .subhead {
    text-align: center; font-size: 12.5px;
    color: var(--muted); margin-bottom: 20px;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  /* Two Column Row */
  .two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  /* Pill Input */
  .pill-group {
    display: flex; flex-direction: column; gap: 3px;
  }
  .pill-group label {
    font-size: 10px; font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.7px; text-transform: uppercase;
    margin-left: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .pill-input-wrap { position: relative; }
  .pill-input-wrap input {
    width: 100%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 13px 18px;
    color: var(--text-bright);
    font-size: 13.5px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: all 0.25s ease;
  }
  .pill-input-wrap input::placeholder { color: #4b5563; font-size: 12.5px; }
  .pill-input-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
  }
  .pill-input-wrap input.input-error {
    border-color: var(--error);
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08);
  }
  .pill-input-wrap input.input-ok {
    border-color: var(--success);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.08);
  }

  .pill-input-wrap .eye-btn {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    padding: 7px; color: var(--muted);
    border-radius: 50%; transition: all 0.2s;
  }
  .pill-input-wrap .eye-btn:hover { color: #fff; background: var(--surface-3); }

  .pill-hint {
    font-size: 10.5px; min-height: 14px;
    margin-left: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 3px;
  }
  .pill-hint.valid { color: var(--success); }
  .pill-hint.invalid { color: var(--error); }
  .pill-hint.checking { color: var(--warning); }

  /* Password Strength Dots */
  .pass-strength-dots {
    display: flex; align-items: center; gap: 6px;
    margin-left: 14px; margin-top: 2px;
  }
  .pass-strength-dots .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: all 0.3s ease;
  }
  .pass-strength-dots .dot.active.weak { background: #ef4444; border-color: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
  .pass-strength-dots .dot.active.fair { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.5); }
  .pass-strength-dots .dot.active.good { background: #eab308; border-color: #eab308; box-shadow: 0 0 6px rgba(234, 179, 8, 0.5); }
  .pass-strength-dots .dot.active.strong { background: #10b981; border-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
  .pass-strength-label {
    font-size: 10px; font-weight: 600; margin-left: 4px;
  }
  .pass-strength-label.weak { color: #ef4444; }
  .pass-strength-label.fair { color: #f59e0b; }
  .pass-strength-label.good { color: #eab308; }
  .pass-strength-label.strong { color: #10b981; }

  .ref-pill { letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

  /* Terms */
  .terms-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 14px;
    background: var(--surface-2);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
  }
  .terms-row input {
    margin-top: 2px; accent-color: var(--primary);
    width: 15px; height: 15px; flex: none; cursor: pointer;
  }
  .terms-row label {
    font-size: 11px; color: var(--muted);
    line-height: 1.4; cursor: pointer;
  }
  .terms-row label a {
    color: var(--primary-light); text-decoration: none; font-weight: 600;
  }

  /* Submit */
  .submit-pill {
    width: 100%; padding: 14px;
    border: none; border-radius: var(--radius-pill);
    background: var(--primary);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 28px var(--primary-glow);
    letter-spacing: 0.3px;
  }
  .submit-pill:hover:not(:disabled) {
    background: var(--primary-dark);
    box-shadow: 0 12px 36px var(--primary-glow);
    transform: translateY(-1px);
  }
  .submit-pill:active:not(:disabled) { transform: scale(0.98); }
  .submit-pill:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner-mini {
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .submit-pill.loading .spinner-mini { display: inline-block; }
  .submit-pill.loading .btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .login-redirect {
    text-align: center; margin-top: 18px;
    font-size: 12.5px; color: var(--muted);
  }
  .login-redirect a {
    color: var(--primary-light); text-decoration: none; font-weight: 700;
  }

  /* Toast */
  .toast-zone {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    width: calc(100% - 32px); max-width: 380px;
  }
  .toast-item {
    background: var(--surface-3); border: 1px solid var(--border);
    padding: 13px 15px; border-radius: var(--radius-md);
    font-size: 12.5px; box-shadow: var(--shadow-card);
    animation: toastSlide 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    display: flex; align-items: center; gap: 8px; font-weight: 500;
  }
  .toast-item.error { border-left: 4px solid var(--error); }
  .toast-item.success { border-left: 4px solid var(--success); }
  .toast-emoji { font-size: 16px; flex: none; }

  @keyframes toastSlide {
    from { opacity: 0; transform: translateX(80px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Success Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(3, 7, 18, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    z-index: 150; padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-dialog {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 28px;
    max-width: 400px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    animation: popIn 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-dialog .check-circle {
    width: 70px; height: 70px; border-radius: 50%;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(16, 185, 129, 0.12);
    border: 2px solid rgba(16, 185, 129, 0.3);
  }
  .modal-dialog .check-circle svg { color: var(--success); width: 32px; height: 32px; }
  .modal-dialog h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px;
  }
  .modal-dialog .modal-username {
    font-size: 13px; color: var(--primary-light); font-weight: 600; margin-bottom: 4px;
  }
  .modal-dialog .modal-ref {
    font-size: 12px; color: var(--muted); margin-bottom: 14px;
    font-family: 'Space Grotesk', sans-serif; letter-spacing: 1px;
  }
  .modal-dialog .bonus-alert {
    background: rgba(124, 58, 237, 0.12);
    border: 1px solid rgba(124, 58, 237, 0.25);
    border-radius: var(--radius-pill);
    padding: 12px 20px; margin-bottom: 20px;
    font-size: 13px; color: var(--primary-light); font-weight: 600;
    display: inline-block;
  }
  .modal-dialog .modal-btn {
    width: 100%; padding: 14px;
    border: none; border-radius: var(--radius-pill);
    background: var(--primary); color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 6px 20px var(--primary-glow);
  }
  .modal-dialog .modal-btn:hover { background: var(--primary-dark); }

  @media (max-width: 420px) {
    .page-wrapper { padding: 12px; }
    .register-card { padding: 22px 14px 18px; }
    .two-col { grid-template-columns: 1fr; gap: 14px; }
    .logo-text { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="bg-geo geo-1"></div>
<div class="bg-geo geo-2"></div>
<div class="bg-geo geo-3"></div>
<div class="bg-geo geo-4"></div>
<div class="toast-zone" id="toastZone"></div>

<div class="page-wrapper">
  <!-- Logo -->
  <div class="logo-area">
    <div class="logo-mark">
      <div class="logo-hex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <span class="logo-text">COVIX</span>
    </div>
    <p class="tagline">Invest Smart • Earn Daily</p>
  </div>

  <!-- Bonus Strip -->
  <div class="bonus-strip">
    <div class="gift-icon">🎁</div>
    <div class="bonus-info">
      <h4>₦1,000 Welcome Bonus</h4>
      <span>Instantly added to your deposit wallet</span>
    </div>
  </div>

  <!-- Register Card -->
  <div class="register-card">
    <h2>Create Account</h2>
    <p class="subhead">Fill in your details below</p>

    <form id="registerForm" novalidate>
      <!-- Full Name & Username on Same Row -->
      <div class="two-col">
        <div class="pill-group">
          <label for="fullName">Full Name</label>
          <div class="pill-input-wrap">
            <input type="text" id="fullName" placeholder="John Doe" autocomplete="name" required>
          </div>
          <div class="pill-hint" id="nameHint"></div>
        </div>
        <div class="pill-group">
          <label for="username">Username</label>
          <div class="pill-input-wrap">
            <input type="text" id="username" placeholder="johndoe" autocomplete="off" required>
          </div>
          <div class="pill-hint" id="usernameHint"></div>
        </div>
      </div>

      <!-- Phone (11 digits, no prefix) -->
      <div class="pill-group">
        <label for="phone">Phone Number (11 Digits)</label>
        <div class="pill-input-wrap">
          <input type="tel" id="phone" placeholder="08012345678" inputmode="numeric" maxlength="11" autocomplete="tel" required>
        </div>
        <div class="pill-hint" id="phoneHint"></div>
      </div>

      <!-- Email -->
      <div class="pill-group">
        <label for="email">Email Address</label>
        <div class="pill-input-wrap">
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <div class="pill-hint" id="emailHint"></div>
      </div>

      <!-- Password -->
      <div class="pill-group">
        <label for="password">Password</label>
        <div class="pill-input-wrap">
          <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required>
          <button type="button" class="eye-btn" data-target="password" aria-label="Toggle">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pass-strength-dots" id="passStrengthDots">
          <span class="dot" data-level="1"></span>
          <span class="dot" data-level="2"></span>
          <span class="dot" data-level="3"></span>
          <span class="dot" data-level="4"></span>
          <span class="pass-strength-label" id="passStrengthLabel"></span>
        </div>
        <div class="pill-hint" id="passwordHint"></div>
      </div>

      <!-- Confirm Password -->
      <div class="pill-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="pill-input-wrap">
          <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
          <button type="button" class="eye-btn" data-target="confirmPassword" aria-label="Toggle">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pill-hint" id="confirmHint"></div>
      </div>

      <!-- Referral Code -->
      <div class="pill-group">
        <label for="referral">Referral Code <span style="text-transform:none;opacity:0.5;font-weight:400;">(optional)</span></label>
        <div class="pill-input-wrap">
          <input type="text" id="referral" class="ref-pill" placeholder="CVX-XXXXXX" autocomplete="off">
        </div>
        <div class="pill-hint" id="referralHint"></div>
      </div>

      <!-- Terms -->
      <div class="terms-row">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to Covix's <a href="#" id="termsLink">Terms</a> and <a href="#" id="privacyLink">Privacy Policy</a></label>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-pill" id="submitBtn">
        <span class="btn-label">Create My Account</span>
        <span class="spinner-mini"></span>
      </button>
    </form>
  </div>

  <p class="login-redirect">Already registered? <a href="login.html">Sign in here</a></p>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal-dialog">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20,6 9,17 4,12"/></svg>
    </div>
    <h3>Registration Successful!</h3>
    <p class="modal-username" id="modalUsername">@username</p>
    <p class="modal-ref" id="modalRefCode">CVX-XXXXXX</p>
    <div class="bonus-alert">🎉 ₦1,000 welcome bonus credited!</div>
    <button class="modal-btn" onclick="window.location.href='login.html'">Go to Login</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjANH3YIecQIuVh4KOrHSA2JSVE0MVFdw",
    authDomain: "covix-1f7d2.firebaseapp.com",
    projectId: "covix-1f7d2",
    storageBucket: "covix-1f7d2.firebasestorage.app",
    messagingSenderId: "550748233984",
    appId: "1:550748233984:web:ff2a36a3f601731a4ad3e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function flashToast(msg, type = "info", dur = 4000) {
    const zone = document.getElementById("toastZone");
    const item = document.createElement("div");
    item.className = `toast-item ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    item.innerHTML = `<span class="toast-emoji">${icons[type] || icons.info}</span>${msg}`;
    if (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    zone.appendChild(item);
    setTimeout(() => {
      item.style.opacity = "0"; item.style.transform = "translateX(80px)";
      item.style.transition = "all 0.3s";
      setTimeout(() => { if (item.parentNode) item.remove(); }, 300);
    }, dur);
  }

  // Password Toggle
  document.querySelectorAll(".eye-btn[data-target]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      btn.innerHTML = hidden
        ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });
  });

  // Prefill Referral from URL
  const params = new URLSearchParams(window.location.search);
  const refParam = params.get("ref");
  if (refParam) {
    document.getElementById("referral").value = refParam.toUpperCase();
    setTimeout(() => validateReferralCode(refParam.toUpperCase()), 300);
  }

  const els = {
    fullName: document.getElementById("fullName"),
    username: document.getElementById("username"),
    phone: document.getElementById("phone"),
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    confirmPassword: document.getElementById("confirmPassword"),
    referral: document.getElementById("referral"),
    terms: document.getElementById("terms"),
    submitBtn: document.getElementById("submitBtn")
  };

  function setHint(id, msg, state) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.className = "pill-hint" + (state ? " " + state : ""); }
  }
  function markInput(el, state) {
    if (el) { el.classList.remove("input-error", "input-ok"); if (state) el.classList.add(state); }
  }

  const patterns = {
    username: /^[a-z0-9_]{3,20}$/,
    email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
    phone: /^\d{11}$/,
    refCode: /^CVX-[A-Z0-9]{6}$/
  };

  // Validators
  function checkName() {
    const v = els.fullName.value.trim();
    const ok = v.length >= 3;
    setHint("nameHint", ok ? "✓" : "Required", ok ? "valid" : "invalid");
    markInput(els.fullName, ok ? "input-ok" : "input-error");
    return ok;
  }
  function checkPhone() {
    const v = els.phone.value.trim();
    const ok = patterns.phone.test(v) && v.startsWith("0");
    setHint("phoneHint", ok ? "✓ Valid" : "11 digits starting with 0", ok ? "valid" : "invalid");
    markInput(els.phone, ok ? "input-ok" : "input-error");
    return ok;
  }
  function checkEmail() {
    const v = els.email.value.trim();
    const ok = patterns.email.test(v);
    setHint("emailHint", ok ? "✓" : "Invalid email", ok ? "valid" : "invalid");
    markInput(els.email, ok ? "input-ok" : "input-error");
    return ok;
  }

  function passScore(v) {
    let s = 0;
    if (v.length >= 8) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/\d/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    return s;
  }

  function updatePassDots(s) {
    const dots = document.querySelectorAll("#passStrengthDots .dot");
    const label = document.getElementById("passStrengthLabel");
    const levels = ["", "weak", "fair", "good", "strong"];
    const labels = ["", "Weak", "Fair", "Good", "Strong"];
    
    dots.forEach((dot, i) => {
      dot.classList.remove("active", "weak", "fair", "good", "strong");
      if (i < s) {
        dot.classList.add("active", levels[s]);
      }
    });
    
    label.className = "pass-strength-label";
    if (s > 0) {
      label.textContent = labels[s];
      label.classList.add(levels[s]);
    } else {
      label.textContent = "";
    }
  }

  function checkPassword() {
    const v = els.password.value;
    const s = passScore(v);
    updatePassDots(s);
    let msg = "", state = "";
    if (v.length === 0) {}
    else if (v.length < 8) { msg = "Min 8 characters"; state = "invalid"; }
    else if (s >= 3) { msg = "✓ Strong password"; state = "valid"; }
    else { msg = "Add numbers/symbols"; state = "checking"; }
    setHint("passwordHint", msg, state);
    markInput(els.password, state === "valid" ? "input-ok" : state === "invalid" ? "input-error" : "");
    return s >= 2 && v.length >= 8;
  }

  function checkConfirm() {
    const v = els.confirmPassword.value;
    if (v.length === 0) { setHint("confirmHint", ""); return false; }
    const ok = v === els.password.value;
    setHint("confirmHint", ok ? "✓ Match" : "Don't match", ok ? "valid" : "invalid");
    markInput(els.confirmPassword, ok ? "input-ok" : "input-error");
    return ok;
  }

  // Attach Listeners
  els.fullName.addEventListener("blur", checkName);
  els.phone.addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11); });
  els.phone.addEventListener("blur", checkPhone);
  els.email.addEventListener("blur", checkEmail);
  els.password.addEventListener("input", () => { checkPassword(); if (els.confirmPassword.value) checkConfirm(); });
  els.confirmPassword.addEventListener("input", checkConfirm);

  // Username Check
  const userCache = {};
  let userTimer, userAvailable = false;

  els.username.addEventListener("input", function(e) {
    this.value = this.value.toLowerCase().replace(/[^a-z0-9_]/g, "");
    const val = this.value.trim();
    clearTimeout(userTimer);
    userAvailable = false;

    if (val.length === 0) { setHint("usernameHint", "", ""); markInput(els.username, ""); return; }
    if (!patterns.username.test(val)) {
      setHint("usernameHint", "3-20 chars: a-z, 0-9, _", "invalid");
      markInput(els.username, "input-error");
      return;
    }
    if (userCache[val] !== undefined) { applyUserResult(val, userCache[val]); return; }

    setHint("usernameHint", "Checking...", "checking");
    markInput(els.username, "");

    userTimer = setTimeout(async () => {
      try {
        const snap = await getDoc(doc(db, "usernames", val));
        const available = !snap.exists();
        userCache[val] = available;
        if (els.username.value.trim() === val) applyUserResult(val, available);
      } catch (err) {
        if (els.username.value.trim() === val) {
          setHint("usernameHint", "Check failed", "invalid");
          markInput(els.username, "input-error");
        }
      }
    }, 500);
  });

  function applyUserResult(val, available) {
    if (els.username.value.trim() !== val) return;
    if (available) {
      setHint("usernameHint", "✓ Available", "valid");
      markInput(els.username, "input-ok");
      userAvailable = true;
    } else {
      setHint("usernameHint", "✗ Taken", "invalid");
      markInput(els.username, "input-error");
      userAvailable = false;
    }
  }

  // Referral Validation
  let refValid = true;
  let refData = null;

  async function validateReferralCode(code) {
    if (!code || code.length === 0) { setHint("referralHint", "", ""); markInput(els.referral, ""); refValid = true; refData = null; return; }
    if (!patterns.refCode.test(code)) { setHint("referralHint", "Format: CVX-XXXXXX", "invalid"); markInput(els.referral, "input-error"); refValid = false; refData = null; return; }
    setHint("referralHint", "Checking...", "checking");
    try {
      const snap = await getDoc(doc(db, "referralCodes", code));
      if (snap.exists()) {
        setHint("referralHint", "✓ Valid", "valid");
        markInput(els.referral, "input-ok");
        refValid = true; refData = snap.data();
      } else {
        setHint("referralHint", "✗ Invalid", "invalid");
        markInput(els.referral, "input-error");
        refValid = false; refData = null;
      }
    } catch (err) { setHint("referralHint", "Check failed", "invalid"); refValid = false; }
  }

  els.referral.addEventListener("input", function(e) {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 10);
    clearTimeout(this._refTimer);
    this._refTimer = setTimeout(() => validateReferralCode(this.value.trim()), 500);
  });
  els.referral.addEventListener("blur", function() { validateReferralCode(this.value.trim()); });

  // Code Generator
  function makeCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "CVX-";
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }
  async function uniqueCode() {
    for (let i = 0; i < 5; i++) {
      const code = makeCode();
      if (!(await getDoc(doc(db, "referralCodes", code))).exists()) return code;
    }
    return makeCode() + "X";
  }

  // Submit
  document.getElementById("registerForm").addEventListener("submit", async e => {
    e.preventDefault();

    if (!checkName() || !checkPhone() || !checkEmail() || !checkPassword() || !checkConfirm()) {
      flashToast("Fix highlighted fields", "error"); return;
    }
    if (!patterns.username.test(els.username.value.trim())) {
      flashToast("Invalid username", "error"); return;
    }
    if (!userAvailable) {
      flashToast("Username not available", "error"); return;
    }
    const refCode = els.referral.value.trim().toUpperCase();
    if (refCode && !refValid) {
      flashToast("Invalid referral code", "error"); return;
    }
    if (!els.terms.checked) {
      flashToast("Accept the Terms of Service", "error"); return;
    }

    els.submitBtn.disabled = true;
    els.submitBtn.classList.add("loading");

    const username = els.username.value.trim();
    const fullName = els.fullName.value.trim();
    const phone = els.phone.value.trim();
    const email = els.email.value.trim();
    const WELCOME_BONUS = 1000;

    try {
      let referrerUid = null;
      if (refCode && refData) {
        referrerUid = refData.uid;
      } else if (refCode) {
        const refSnap = await getDoc(doc(db, "referralCodes", refCode));
        if (refSnap.exists()) referrerUid = refSnap.data().uid;
      }

      const cred = await createUserWithEmailAndPassword(auth, email, els.password.value);
      const uid = cred.user.uid;
      const myCode = await uniqueCode();

      // Add to referrer's downlines
      if (referrerUid) {
        const dlSnap = await getDoc(doc(db, "users", referrerUid, "referrals", "downlines"));
        let dlIds = [];
        if (dlSnap.exists()) dlIds = dlSnap.data().ids || [];
        if (!dlIds.includes(uid)) {
          dlIds.push(uid);
          await setDoc(doc(db, "users", referrerUid, "referrals", "downlines"), { ids: dlIds });
        }
      }

      await Promise.all([
        setDoc(doc(db, "users", uid), {
          name: fullName, username, phone, email,
          referralCode: myCode, referredBy: referrerUid,
          depositWallet: WELCOME_BONUS, withdrawalWallet: 0,
          totalDeposit: WELCOME_BONUS, totalInvested: 0,
          totalEarnings: 0, referralEarnings: 0,
          activePlansCount: 0, totalWithdrawn: 0,
          createdAt: serverTimestamp()
        }),
        setDoc(doc(db, "usernames", username), { uid, referralCode: myCode }),
        setDoc(doc(db, "referralCodes", myCode), { uid, username }),
        setDoc(doc(db, "users", uid, "transactions", "welcome_bonus"), {
          type: "bonus", amount: WELCOME_BONUS, description: "Welcome Bonus", timestamp: serverTimestamp()
        }),
        setDoc(doc(db, "users", uid, "transactions", "recent"), {
          items: [{ type: "bonus", amount: WELCOME_BONUS, description: "Welcome Bonus", timestamp: { seconds: Math.floor(Date.now() / 1000) } }]
        }),
        setDoc(doc(db, "users", uid, "investments", "active_list"), { activeIds: [] })
      ]);

      // Show success modal with user details
      document.getElementById("modalUsername").textContent = "@" + username;
      document.getElementById("modalRefCode").textContent = myCode;
      document.getElementById("successModal").classList.add("show");

    } catch (err) {
      console.error("Register error:", err);
      let msg = "Registration failed. Try again.";
      if (err.code === "auth/email-already-in-use") msg = "Email already registered.";
      flashToast(msg, "error");
      els.submitBtn.disabled = false;
      els.submitBtn.classList.remove("loading");
    }
  });

  // Terms / Privacy
  document.getElementById("termsLink")?.addEventListener("click", e => { e.preventDefault(); flashToast("Terms page coming soon", "info"); });
  document.getElementById("privacyLink")?.addEventListener("click", e => { e.preventDefault(); flashToast("Privacy page coming soon", "info"); });

  console.log("⚡ Covix Register — Ready");
</script>
</body>
</html>
