<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>COVIX — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060e;
    --surface: #0e0e1a;
    --surface-2: #151528;
    --surface-3: #1c1c35;
    --primary: #7c3aed;
    --primary-light: #a78bfa;
    --primary-dark: #6d28d9;
    --primary-glow: rgba(124, 58, 237, 0.3);
    --accent: #06b6d4;
    --accent-glow: rgba(6, 182, 212, 0.25);
    --text: #e2e8f0;
    --text-bright: #f8fafc;
    --muted: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --border: rgba(148, 163, 184, 0.08);
    --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 60px rgba(124, 58, 237, 0.15);
    --radius: 24px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    background-image:
      radial-gradient(ellipse at 85% 15%, rgba(6, 182, 212, 0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 15% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(124, 58, 237, 0.03) 0%, transparent 60%);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(100px);
    opacity: 0.35;
  }
  .orb-1 {
    width: 320px;
    height: 320px;
    background: rgba(6, 182, 212, 0.16);
    top: -100px;
    right: -80px;
    animation: drift1 14s ease-in-out infinite;
  }
  .orb-2 {
    width: 300px;
    height: 300px;
    background: rgba(124, 58, 237, 0.15);
    bottom: -100px;
    left: -90px;
    animation: drift2 16s ease-in-out infinite;
  }
  .orb-3 {
    width: 220px;
    height: 220px;
    background: rgba(124, 58, 237, 0.1);
    top: 40%;
    left: 50%;
    animation: drift3 12s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-40px, 35px) scale(1.12); }
    66% { transform: translate(25px, -20px) scale(0.9); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(35px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.88); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, -20px) scale(1.08); }
  }

  .main-container {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 36px 20px;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 36px;
    animation: slideUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 20px 8px 8px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-glow);
  }
  .brand-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
  }
  .brand-icon svg {
    width: 20px;
    height: 20px;
    color: #fff;
  }
  .brand-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text-bright);
    letter-spacing: -0.3px;
  }

  .brand-header h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: var(--text-bright);
    letter-spacing: -0.8px;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .brand-header h2 .highlight {
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-header .subtitle {
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 400;
  }

  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 24px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s both;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-group label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .input-shell {
    position: relative;
  }
  .input-shell input {
    width: 100%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 13px 16px;
    color: var(--text-bright);
    font-size: 14px;
    font-family: 'Outfit', sans-serif;
    outline: none;
    transition: all 0.25s ease;
    letter-spacing: 0.2px;
  }
  .input-shell input::placeholder {
    color: #4a4a6a;
  }
  .input-shell input:focus {
    border-color: var(--primary);
    background: var(--surface-3);
    box-shadow: 0 0 0 4px var(--primary-glow);
  }
  .input-shell input.input-error {
    border-color: var(--error);
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
  }

  .input-shell .toggle-pwd {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    color: var(--muted);
    border-radius: 6px;
    transition: all 0.2s;
  }
  .input-shell .toggle-pwd:hover {
    color: var(--text-bright);
    background: var(--surface-3);
  }

  .field-hint {
    font-size: 10.5px;
    min-height: 14px;
    font-weight: 500;
  }
  .field-hint.invalid {
    color: var(--error);
  }

  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-top: -10px;
  }
  .forgot-link {
    font-size: 12.5px;
    color: var(--primary-light);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }
  .forgot-link:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .cta-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius-xs);
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 30px var(--primary-glow);
    position: relative;
    overflow: hidden;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .cta-button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.08), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .cta-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 15px 45px var(--primary-glow);
  }
  .cta-button:hover:not(:disabled)::after {
    transform: translateX(100%);
  }
  .cta-button:active:not(:disabled) {
    transform: scale(0.97);
  }
  .cta-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-loader {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .cta-button.busy .btn-loader {
    display: inline-block;
  }
  .cta-button.busy .btn-text {
    display: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .signup-prompt {
    text-align: center;
    margin-top: 28px;
    font-size: 13.5px;
    color: var(--muted);
    animation: slideUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s both;
  }
  .signup-prompt a {
    color: var(--primary-light);
    text-decoration: none;
    font-weight: 700;
  }
  .signup-prompt a:hover {
    text-decoration: underline;
  }

  .toast-zone {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 390px;
  }
  .toast-item {
    background: var(--surface-3);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: var(--radius-xs);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
  }
  .toast-item.error {
    border-left: 4px solid var(--error);
  }
  .toast-item.success {
    border-left: 4px solid var(--success);
  }
  .toast-emoji {
    font-size: 18px;
    flex: none;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(80px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 480px) {
    .main-container {
      padding: 24px 12px;
    }
    .form-panel {
      padding: 22px 16px;
    }
    .brand-header h2 {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="toast-zone" id="toastZone"></div>

<div class="main-container">
  <div class="brand-header">
    <div class="brand-badge">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <span class="brand-name">COVIX</span>
    </div>
    <h2>Welcome <span class="highlight">back</span></h2>
    <p class="subtitle">Sign in to continue your journey</p>
  </div>

  <div class="form-panel">
    <form id="loginForm" novalidate>
      <div class="field-group">
        <label for="email">Email Address</label>
        <div class="input-shell">
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field-hint" id="emailHint"></div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-shell">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-pwd" data-target="password" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-hint" id="passwordHint"></div>
      </div>

      <div class="forgot-row">
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="cta-button" id="submitBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader"></span>
      </button>
    </form>
  </div>

  <div class="signup-prompt">
    Don't have an account? <a href="register.html">Create one</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjANH3YIecQIuVh4KOrHSA2JSVE0MVFdw",
    authDomain: "covix-1f7d2.firebaseapp.com",
    projectId: "covix-1f7d2",
    storageBucket: "covix-1f7d2.firebasestorage.app",
    messagingSenderId: "550748233984",
    appId: "1:550748233984:web:ff2a36a3f601731a4ad3e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function flashToast(msg, type = "info", dur = 4000) {
    const zone = document.getElementById("toastZone");
    const item = document.createElement("div");
    item.className = `toast-item ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    item.innerHTML = `<span class="toast-emoji">${icons[type] || icons.info}</span>${msg}`;
    if (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    zone.appendChild(item);
    setTimeout(() => {
      item.style.opacity = "0";
      item.style.transform = "translateX(80px)";
      item.style.transition = "all 0.3s";
      setTimeout(() => { if (item.parentNode) item.remove(); }, 300);
    }, dur);
  }

  document.querySelectorAll(".toggle-pwd[data-target]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });
  });

  const els = {
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    submitBtn: document.getElementById("submitBtn"),
    form: document.getElementById("loginForm")
  };

  function setHint(id, msg, state) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.className = "field-hint" + (state ? " " + state : ""); }
  }
  function markInput(el, state) {
    if (el) { el.classList.remove("input-error"); if (state) el.classList.add(state); }
  }

  function validateEmail() {
    const v = els.email.value.trim();
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    setHint("emailHint", ok ? "" : "Enter a valid email address", ok ? "" : "invalid");
    markInput(els.email, ok ? "" : "input-error");
    return ok;
  }
  function validatePassword() {
    const v = els.password.value;
    setHint("passwordHint", "");
    markInput(els.password, "");
    return v.length > 0;
  }

  els.email.addEventListener("blur", validateEmail);
  els.password.addEventListener("input", validatePassword);

  els.form.addEventListener("submit", async e => {
    e.preventDefault();

    if (!validateEmail()) {
      flashToast("Please enter a valid email address", "error");
      return;
    }
    if (!validatePassword()) {
      flashToast("Please enter your password", "error");
      return;
    }

    els.submitBtn.disabled = true;
    els.submitBtn.classList.add("busy");
    setHint("emailHint", "");
    setHint("passwordHint", "");

    try {
      const cred = await signInWithEmailAndPassword(auth, els.email.value.trim(), els.password.value);
      const uid = cred.user.uid;

      const userSnap = await getDoc(doc(db, "users", uid));
      if (!userSnap.exists()) {
        flashToast("Account data not found. Please contact support.", "error");
        await auth.signOut();
        els.submitBtn.disabled = false;
        els.submitBtn.classList.remove("busy");
        return;
      }

      const userData = userSnap.data();
      sessionStorage.setItem("covix_user_cache", JSON.stringify({
        uid,
        name: userData.name,
        username: userData.username,
        referralCode: userData.referralCode
      }));

      flashToast("Login successful! Redirecting...", "success", 2000);
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1200);
    } catch (err) {
      let msg = "Login failed. Please try again.";
      switch (err.code) {
        case "auth/user-not-found":
          msg = "No account found with this email.";
          markInput(els.email, "input-error");
          break;
        case "auth/wrong-password":
          msg = "Incorrect password. Please try again.";
          markInput(els.password, "input-error");
          break;
        case "auth/invalid-credential":
          msg = "Invalid email or password.";
          break;
        case "auth/too-many-requests":
          msg = "Too many attempts. Please try again later.";
          break;
        case "auth/invalid-email":
          msg = "Please enter a valid email address.";
          markInput(els.email, "input-error");
          break;
      }
      flashToast(msg, "error");
      els.submitBtn.disabled = false;
      els.submitBtn.classList.remove("busy");
    }
  });

  document.getElementById("forgotLink")?.addEventListener("click", e => {
    e.preventDefault();
    flashToast("Password reset page coming soon.", "info");
  });

  console.log("⚡ Covix Login — Ready");
</script>
</body>
</html>
